  <!-- Interactive Line Following Cursor -->
  <canvas id="cursor-trail"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('cursor-trail');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // Chain of points for the smooth trailing ribbon line
      const TOTAL_POINTS = 28;
      const points = [];
      let mouse = { x: width / 2, y: height / 2, active: false };

      for (let i = 0; i < TOTAL_POINTS; i++) {
        points.push({ x: width / 2, y: height / 2 });
      }

      function updateMousePos(x, y) {
        mouse.x = x;
        mouse.y = y;
        if (!mouse.active) {
          mouse.active = true;
          for (let p of points) {
            p.x = x;
            p.y = y;
          }
        }
      }

      window.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      function animate() {
        ctx.clearRect(0, 0, width, height);

        if (mouse.active) {
          // Lead point tracks cursor
          points[0].x += (mouse.x - points[0].x) * 0.42;
          points[0].y += (mouse.y - points[0].y) * 0.42;

          // Each following point lerps toward previous point
          for (let i = 1; i < TOTAL_POINTS; i++) {
            points[i].x += (points[i - 1].x - points[i].x) * 0.35;
            points[i].y += (points[i - 1].y - points[i].y) * 0.35;
          }

          // Render glowing line segments with tapered width and cyber colors
          for (let i = 0; i < TOTAL_POINTS - 1; i++) {
            const p1 = points[i];
            const p2 = points[i + 1];

            const progress = i / (TOTAL_POINTS - 1);
            const alpha = 1 - progress * 0.85;
            const lineWidth = Math.max(0.8, (1 - progress) * 3.6);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);

            ctx.strokeStyle = i < TOTAL_POINTS * 0.45 
              ? `rgba(0, 240, 255, ${alpha})` 
              : `rgba(112, 0, 255, ${alpha})`;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00f0ff';
            ctx.stroke();
          }
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
